name: CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid burning minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (real MySQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend test suite
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 5
          if-no-files-found: ignore

  frontend:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build (type-check + production bundle)
        working-directory: frontend
        run: npm run build

  e2e-packaged:
    name: Playwright against the packaged Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env for the compose stack
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci_only_password/" .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci_only_root_password/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_only_password/" .env
          sed -i "s/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=ci-only-admin-password-123/" .env
          # The E2E suite registers dozens of customers from one IP; production keeps the strict default (20/hour).
          sed -i "s/^RATE_LIMIT_REGISTER_PER_HOUR=.*/RATE_LIMIT_REGISTER_PER_HOUR=1000/" .env
          sed -i "s/^RATE_LIMIT_LOGIN_PER_MINUTE=.*/RATE_LIMIT_LOGIN_PER_MINUTE=200/" .env

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "app never became healthy" >&2
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite against the packaged app
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          E2E_TARGET: packaged
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 5
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
